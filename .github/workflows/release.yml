# Jeder Push auf main = neue Version (letzte Stelle +1, siehe scripts/version.sh).
# Baut die App, signiert sie mit dem festen WindowMover-Zertifikat (damit die Bedienungshilfen-
# Berechtigung bei Updates erhalten bleibt) und veröffentlicht ein GitHub-Release mit .zip und .dmg.
# Die installierte App prüft beim Start auf neue Releases und installiert sie automatisch.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
      SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bestimmen
        id: v
        run: |
          VERSION="$(scripts/version.sh)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION existiert bereits – nichts zu tun."
          fi
          echo "▸ Version $VERSION"

      - name: Signatur-Zertifikat importieren
        if: steps.v.outputs.exists != 'true' && env.SIGNING_P12_BASE64 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(openssl rand -hex 16)"
          echo "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | xargs)
          rm "$RUNNER_TEMP/sign.p12"
          ID="$(security find-identity -p codesigning "$KC" | awk '/\)/ {print $2; exit}')"
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: App bauen
        if: steps.v.outputs.exists != 'true'
        env:
          APP_VERSION: ${{ steps.v.outputs.version }}
        run: |
          ./build.sh
          codesign -d -r- build/WindowMover.app

      - name: Pakete erstellen
        if: steps.v.outputs.exists != 'true'
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/WindowMover.app "dist/WindowMover-$V-macOS.zip"
          STAGE="$(mktemp -d)"
          cp -R build/WindowMover.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "WindowMover $V" -srcfolder "$STAGE" -ov -format UDZO "dist/WindowMover-$V.dmg" >/dev/null

      - name: GitHub-Release veröffentlichen
        if: steps.v.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          git log --no-merges --pretty='- %s' $RANGE > notes.md
          gh release create "v$V" dist/* --title "WindowMover $V" --notes-file notes.md --target "$GITHUB_SHA"

      - name: Aufräumen
        if: always() && env.SIGN_KEYCHAIN != ''
        run: security delete-keychain "$SIGN_KEYCHAIN" || true
